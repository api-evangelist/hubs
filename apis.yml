name: hubs
description: >-
  Hubs, now operating as Protolabs Network and formerly known as 3D Hubs, is an
  on-demand digital manufacturing platform founded in Amsterdam in 2013 and
  acquired by Protolabs in 2021. It gives engineers and product teams instant
  online quoting, automated design-for-manufacturing analysis, and access to a
  vetted global network of more than 250 manufacturing partners for CNC
  machining, 3D printing, sheet metal fabrication, and injection molding, from
  low-volume prototyping through production-scale runs. Hubs was backed by
  Balderton Capital prior to the Protolabs acquisition.
